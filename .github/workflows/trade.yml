name: 仮想運用

# GitHubのcronは高負荷時に大幅に遅れたり、実行が飛ぶことがある（公式に明記されている）。
# 実際に運用開始直後、08:17のスケジュール実行を最後に、30分間隔に変更した後も
# 17時間まるごと発火しない状態を確認した（cron構文・YAML構文は正常）。
# ファイルを一度削除して再追加し、GitHub側のスケジュール登録をやり直している。
# それでも直らない場合は外部トリガー（cron-job.org等からworkflow_dispatch APIを
# 叩く）への切り替えを検討する。
on:
  schedule:
    - cron: "17,47 * * * *"   # 毎時17分・47分（0分ちょうどは混雑して遅れやすい）
  workflow_dispatch:           # 手動実行も可能

permissions:
  contents: write              # 状態をdataブランチへ書き戻すため

env:
  # ランナーは既定でUTC。そのままだとローカル実行(JST)のログと混ざり、
  # 同じCSVに9時間ずれた時刻が並んでグラフの時間軸が壊れる。
  TZ: Asia/Tokyo
  # ダッシュボードの「次の実行まで」はこの値から逆算する。
  # 上のcronの間隔（分,分 → 30分）と必ず一致させること。
  # ここを直し忘れると数値がズレたまま画面に出続ける（実際に一度そうなった）。
  RUN_INTERVAL_SEC: "1800"

# 同時に2つ走ると同じ状態を奪い合うので直列化する
concurrency:
  group: live-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: コードを取得
        uses: actions/checkout@v5

      - name: 前回の状態を取得（初回は存在しない）
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: data
          path: .prev

      - name: 状態を復元
        run: |
          for d in state results; do
            if [ -d ".prev/$d" ]; then
              mkdir -p "$d" && cp -r ".prev/$d/." "$d/"
              echo "復元: $d"
            fi
          done
          rm -rf .prev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 自動テスト
        run: python test_all.py

      - name: 1回ぶんの売買判断
        run: python live_trade.py --ci

      - name: 静的ダッシュボードを生成
        run: python publish_static.py publish

      - name: 状態を data ブランチへ保存
        run: |
          cd publish
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "運用状態 $(date -u '+%Y-%m-%d %H:%MZ')"
          # 毎回1コミットだけの新しい履歴を強制的に置き換える。
          # 追記していくと年に何千コミットも積み上がるため。
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      - name: 結果を表示
        run: python live_trade.py --status
